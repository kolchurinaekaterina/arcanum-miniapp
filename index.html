<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0c0c"><title>Арканум — Три карты. Один вопрос.</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4ead5;background:#080808}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#1b1812 0,#080808 55%);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:520px;margin:auto;padding:24px 18px 90px}.head{text-align:center;padding:25px 0 22px}.sigil{border:1px solid #bca16a;border-radius:100%;width:70px;height:70px;margin:auto;display:grid;place-items:center;font-size:33px;color:#e6c78e}.brand{letter-spacing:.22em;font-family:Georgia,serif;color:#e7c98f;font-size:31px;margin:15px 0 6px}.sub{font-size:13px;color:#b7aa90;line-height:1.6}.panel{background:#141414;border:1px solid #5b492a;border-radius:20px;padding:19px;margin-top:16px;box-shadow:0 15px 40px #00000066}.eyebrow{color:#c7a76e;letter-spacing:.15em;text-transform:uppercase;font-size:11px;font-weight:700}h2{font-family:Georgia,serif;font-weight:normal;font-size:25px;margin:8px 0 15px}p{line-height:1.65}.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.topic{background:#1d1b17;border:1px solid #58472d;border-radius:14px;color:#f4e7cc;text-align:left;padding:15px 12px;min-height:85px}.topic.active{border-color:#e5c68d;background:#292419}.topic .emoji{display:block;font-size:25px;margin-bottom:7px}.topic span:last-child{font-size:13px}label{display:block;color:#d3c4a5;font-size:13px;margin:16px 0 8px}textarea,input{width:100%;border:1px solid #665333;background:#0c0c0c;border-radius:12px;color:#fff;padding:13px;outline:none}textarea{min-height:100px;resize:vertical}textarea:focus,input:focus{border-color:#e2c28a}.btn{background:#e3c48c;border:0;border-radius:13px;padding:14px 18px;color:#19150e;font-weight:700;width:100%;margin-top:18px}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;color:#e5c68d;border:1px solid #7b6540}.nav{display:flex;gap:10px}.nav button{flex:1}.hint{font-size:12px;color:#b7aa90;line-height:1.6}.step{color:#a99c82;text-align:center;font-size:12px;margin:10px}.progress{display:flex;gap:5px;margin:18px 0}.progress i{height:3px;background:#40351f;flex:1;border-radius:4px}.progress i.on{background:#e3c48c}.search{margin-bottom:10px}.deck{max-height:260px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}.deck button{padding:10px 8px;border:1px solid #58472d;background:#1d1b17;color:#eee;border-radius:9px;text-align:left;font-size:12px}.deck button:hover{border-color:#e3c48c}.chosen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.card{min-height:140px;background:linear-gradient(145deg,#211d15,#191815);border:1px solid #8e744e;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 5px;gap:7px}.card .symbol{font-size:27px;color:#e3c48c}.card .name{font-size:12px}.card .orient{font-size:10px;color:#b5a688}.card.empty{border-style:dashed;color:#b9ab90}.modeChoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.modeChoice button{background:#1d1b17;color:#f4e7cc;border:1px solid #58472d;border-radius:12px;padding:14px 9px;min-height:78px}.modeChoice button.active{background:#292419;border-color:#e5c68d}.drawCard{min-height:140px;background:repeating-linear-gradient(45deg,#1b1823,#1b1823 8px,#292237 8px,#292237 10px);border:1px solid #bca16a;border-radius:11px;color:#e3c48c;display:flex;align-items:center;justify-content:center;font-size:30px}.drawCard:disabled{opacity:.65}.toggle{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}.toggle input{width:auto;accent-color:#e3c48c}.result h3{font-family:Georgia,serif;font-size:20px;color:#e5c68d;font-weight:normal;margin:24px 0 8px}.result p{font-size:14px;color:#e9dec6}.result .note{border-left:2px solid #e3c48c;padding-left:12px}.historyItem{border-top:1px solid #5b492a;padding:12px 0}.historyItem button{border:0;background:none;color:#e5c68d;padding:0;text-align:left}.hidden{display:none!important}.foot{text-align:center;color:#9c8d72;font-size:11px;margin-top:28px}
</style></head><body><main class="wrap"><header class="head"><div class="sigil">☾✧</div><div class="brand">АРКАНУМ</div><div class="sub">У каждой карты есть значение.<br>У их сочетания — история.</div></header><div id="app"></div><div class="foot">Версия 1.3 · ИИ при подключении сервера · Платежи пока отключены</div></main><script>
const majors=['Шут','Маг','Верховная Жрица','Императрица','Император','Иерофант','Влюблённые','Колесница','Сила','Отшельник','Колесо Фортуны','Справедливость','Повешенный','Смерть','Умеренность','Дьявол','Башня','Звезда','Луна','Солнце','Суд','Мир'];
const ranks=['Туз','Двойка','Тройка','Четвёрка','Пятёрка','Шестёрка','Семёрка','Восьмёрка','Девятка','Десятка','Паж','Рыцарь','Королева','Король'];
const suits=['Жезлов','Кубков','Мечей','Пентаклей'];
const deck=[...majors,...suits.flatMap(s=>ranks.map(r=>r+' '+s))];
const topics=[['❤️','Любовь и отношения'],['💰','Работа и финансы'],['✨','Судьба и жизненный путь'],['🔮','Свой вопрос']];
let mode='random',loading=false,step=0,topic=0,question='',cards=[],reversed=[false,false,false],filter='',result=null,history=JSON.parse(localStorage.getItem('arcanum_demo_history')||'[]');
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buttons(){return `<div class="nav">${step?'<button class="btn secondary" onclick="back()">Назад</button>':''}<button id="continueBtn" class="btn" ${loading||(step===1&&!question.trim())?'disabled':''} onclick="next()">${loading?'Готовим расшифровку…':step===3?'Новый расклад':'Продолжить'}</button></div>`}
function render(){let html=`<div class="step">Шаг ${step+1} из 4</div><div class="progress">${[0,1,2,3].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><section class="panel"><div class="eyebrow">${['Выбор темы','Ваш вопрос','Ваши карты','Расшифровка'][step]}</div>`;
if(step===0)html+=`<h2>Что вас волнует?</h2><div class="topics">${topics.map(([emoji,name],i)=>`<button class="topic ${topic===i?'active':''}" onclick="setTopic(${i})"><span class="emoji">${emoji}</span><span>${name}</span></button>`).join('')}</div><p class="hint">Вы раскладываете карты своей колодой, а «Арканум» помогает прочитать их сочетание.</p>`;
if(step===1)html+=`<h2>Задайте картам вопрос</h2><p class="hint">Сформулируйте то, что хотите понять. Затем самостоятельно вытяните три карты из своей колоды.</p><textarea id="question" maxlength="500" oninput="updateQuestion(this.value)" placeholder="Например: что мне важно понять об этих отношениях?">${esc(question)}</textarea><p class="hint">Максимум 500 символов.</p>`;
if(step===2)html+=`<h2>Ваши три карты</h2><div class="modeChoice"><button class="${mode==='random'?'active':''}" onclick="setMode('random')">✦ Вытянуть карты в приложении</button><button class="${mode==='manual'?'active':''}" onclick="setMode('manual')">☾ Указать карты своей колоды</button></div>${mode==='random'?randomCardsMarkup():manualCardsMarkup()}`;
if(step===3)html+=`<h2>Ваш расклад ✨</h2><p class="hint">${esc(topics[topic][1])} · ${esc(question)}</p><div class="chosen">${cards.map((c,i)=>`<div class="card"><div class="symbol">✦</div><div class="name">${esc(c)}</div><div class="orient">${reversed[i]?'Перевёрнутая':'Прямая'}</div></div>`).join('')}</div><div class="result"><h3>Общий смысл</h3><p>${esc(result.overview)}</p><h3>Что говорят карты вместе</h3><p>${esc(result.connection)}</p><h3>На что обратить внимание</h3><p class="note">${esc(result.advice)}</p></div><p class="hint">${result.source==='ai'?'Индивидуальный разбор с помощью ИИ. Карты — инструмент размышления, не медицинский или финансовый прогноз.':'Демонстрационный разбор: сервер ИИ не подключён. Для индивидуальной трактовки запустите сервер из комплекта.'}</p>`;
html+=buttons()+`</section>`;
html+=`<section class="panel"><div class="eyebrow">История</div><h2>Ваши расклады (${history.length})</h2>${history.length?history.slice().reverse().map((h,i)=>`<div class="historyItem"><button onclick="showHistory(${history.length-1-i})">${esc(h.topic)} · ${esc(h.date)}</button><div class="hint">${esc(h.question.slice(0,80))}</div></div>`).join(''):'<p class="hint">Пока пусто. Первый расклад появится здесь.</p>'}<p class="hint">История хранится только в этом браузере и может исчезнуть при очистке данных.</p></section>`;app.innerHTML=html;}

function manualCardsMarkup(){return `<h2>Какие три карты выпали?</h2><div class="chosen">${[0,1,2].map(i=>`<div class="card ${!cards[i]?'empty':''}" onclick="removeCard(${i})"><div class="symbol">${cards[i]?'✦':'✧'}</div><div class="name">${esc(cards[i]||'Карта '+(i+1))}</div><div class="orient">${cards[i]?(reversed[i]?'Перевёрнутая · убрать ↗':'Прямая · убрать ↗'):'Нажмите ниже'}</div></div>`).join('')}</div>${cards.length?`<label class="toggle"><input type="checkbox" id="reverse" ${reversed[cards.length-1]?'checked':''} onchange="reverseLast(this.checked)">Последняя выбранная карта перевёрнутая</label>`:''}<label>Найти карту из 78</label><input class="search" id="search" placeholder="Например, Королева мечей" value="${esc(filter)}" oninput="searchDeck(this.value)"><div class="deck" id="deck">${deckButtons()}</div><p class="hint">Нажмите на выбранную карту, чтобы удалить её. Ориентацию каждой карты можно изменить при выборе.</p>`;}
function randomCardsMarkup(){return `<p class="hint">Нажимайте на закрытые карты по очереди. Каждая вытягивается случайно из оставшейся колоды, без повторений.</p><div class="chosen">${[0,1,2].map(i=>cards[i]?`<div class="card"><div class="symbol">✦</div><div class="name">${esc(cards[i])}</div><div class="orient">${reversed[i]?'Перевёрнутая':'Прямая'}</div></div>`:`<button class="drawCard" onclick="drawCard(${i})" ${i!==cards.length?'disabled':''} aria-label="Вытянуть карту ${i+1}">☾ ✧</button>`).join('')}</div><p class="hint">Положение карты определяется случайно. Чтобы начать заново, нажмите «Перемешать и начать заново».</p><button class="btn secondary" onclick="resetDraw()">Перемешать и начать заново</button>`;}
function setMode(nextMode){if(mode===nextMode)return;mode=nextMode;cards=[];reversed=[false,false,false];filter='';render();}
function randomInt(max){if(globalThis.crypto&&crypto.getRandomValues){const buf=new Uint32Array(1);const limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(buf)}while(buf[0]>=limit);return buf[0]%max;}return Math.floor(Math.random()*max);}
function drawCard(i){if(mode!=='random'||i!==cards.length||cards.length>=3)return;const available=deck.filter(c=>!cards.includes(c));cards.push(available[randomInt(available.length)]);reversed[cards.length-1]=randomInt(2)===1;render();}
function resetDraw(){cards=[];reversed=[false,false,false];render();}

function deckButtons(){const q=filter.toLocaleLowerCase('ru');return deck.filter(c=>c.toLocaleLowerCase('ru').includes(q)&&!cards.includes(c)).map(c=>`<button onclick="choose(${deck.indexOf(c)})">${esc(c)}</button>`).join('')||'<p class="hint">Карта не найдена</p>'}
function updateQuestion(value){question=value;const btn=document.getElementById('continueBtn');if(btn)btn.disabled=!value.trim()}
function setTopic(i){topic=i;render()}function searchDeck(v){filter=v;document.getElementById('deck').innerHTML=deckButtons()}
function choose(i){if(mode!=='manual')return;if(cards.length===3)return alert('Вы уже выбрали три карты.');cards.push(deck[i]);reversed[cards.length-1]=false;filter='';render()}
function removeCard(i){if(!cards[i])return;cards.splice(i,1);reversed.splice(i,1);reversed.push(false);render()}
function reverseLast(v){reversed[cards.length-1]=v;render()}
function back(){if(step===1)question=document.getElementById('question').value;step=Math.max(0,step-1);render()}
async function next(){
 if(loading)return;
 if(step===1){question=document.getElementById('question').value.trim();if(!question)return alert('Напишите вопрос.')}
 if(step===2&&cards.length!==3)return alert('Выберите ровно три карты.');
 if(step===2){
  loading=true;render();
  try{
   const response=await fetch('/api/reading',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topics[topic][1],question,cards:cards.map((name,i)=>({name,reversed:reversed[i]}))})});
   if(!response.ok)throw Error('Сервер недоступен');
   result=await response.json();
   if(!result.overview||!result.connection||!result.advice)throw Error('Некорректный ответ');
   result.source='ai';
  }catch(e){result=interpret();result.source='demo';}
  loading=false;
  history.push({mode,topic:topics[topic][1],question,cards:[...cards],reversed:[...reversed],date:new Date().toLocaleDateString('ru-RU'),result});
  try{localStorage.setItem('arcanum_demo_history',JSON.stringify(history))}catch(e){}
 }
 if(step===3){step=0;cards=[];reversed=[false,false,false];question='';result=null}else step++;
 render();
}
function interpret(){const c=cards.map((x,i)=>x+(reversed[i]?' (перевёрнутая)':''));const major=cards.filter(x=>majors.includes(x)).length;const theme=['в отношениях','в работе и финансах','на вашем жизненном пути','в заданной ситуации'][topic];return {overview:`Ваш вопрос ${theme} связан с поиском ясности. В раскладе появились ${c.join(', ')}. Это приглашение рассмотреть обстоятельства с разных сторон, а не готовый прогноз будущего.`,connection:`${major>=2?'Преобладание Старших арканов подчёркивает значимость внутренних перемен и выбора.':'Сочетание карт обращает внимание и на повседневные действия, и на ваши ожидания.'} ${reversed.some(Boolean)?'Перевёрнутые положения могут символизировать задержку, сомнение или необходимость пересмотреть привычный подход.':'Прямые положения позволяют начать с очевидных смыслов карт, но важнее их связь с вашим вопросом.'}`,advice:'Отделите то, что вы знаете наверняка, от предположений. Выберите один небольшой шаг, который поможет прояснить ситуацию. Не принимайте медицинские или финансовые решения только на основании карт.'}}
function showHistory(i){const h=history[i];mode=h.mode||'manual';topic=Math.max(0,topics.findIndex(t=>t[1]===h.topic));question=h.question;cards=[...h.cards];reversed=[...h.reversed];result=h.result;step=3;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
